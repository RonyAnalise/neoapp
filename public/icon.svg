    <path d="M -95 -55 L -75 -35 L -70 -25 Z" fill="#fde047" opacity="0.9"/>
    <path d="M -60 -90 L -45 -65 L -35 -60 Z" fill="#fde047" opacity="0.9"/>
    <path d="M -15 -110 L -5 -85 L 5 -85 Z" fill="#fde047" opacity="0.9"/>
    <path d="M 15 -110 L 5 -85 L -5 -85 Z" fill="#fde047" opacity="0.9"/>
    <path d="M 60 -90 L 45 -65 L 35 -60 Z" fill="#fde047" opacity="0.9"/>
    <path d="M 95 -55 L 75 -35 L 70 -25 Z" fill="#fde047" opacity="0.9"/>
    <path d="M 110 -15 L 85 -5 L 85 5 Z" fill="#fde047" opacity="0.9"/>
  </g>

  <!-- Green Energy Lightning / Eco Leaf Symbol -->
  <path d="M 235 240 L 285 240 L 250 310 L 295 310 L 225 400 L 245 330 L 210 330 Z" fill="#4ade80"/>
  
  <!-- Brand text in icon -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">NEOAPP</text>
